name: Verify Find My Bug
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m unittest discover -s tests -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t counterexample-lab-runner:1 runner
      - run: LAB_DOCKER_TESTS=1 python3 -m unittest discover -s tests -v
      - run: python3 -m benchmarks.compare --only sort-drop-last sort-control --seeds 42 --count 4 --budget 10 --output artifacts/ci-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke
          path: artifacts/ci-smoke.json
